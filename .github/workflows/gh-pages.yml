name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 001-docusaurus-book-layout  # Update this to match your default branch name
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ai-book/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ai-book

      - name: Build website
        run: npm run build
        working-directory: ai-book

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ai-book/build
          # The following lines configure the deployment
          publish_branch: gh-pages  # Deploy to the gh-pages branch